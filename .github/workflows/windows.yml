name: desktop-windows

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать Windows-сборки (MSI + Portable ZIP) в GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза (пусто → desktop-preview)"
        required: false
        default: ""

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-test:
    name: "Desktop: сборка и тесты (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: "Самопроверка :core и тесты :desktop"
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon :cli:selftest :desktop:test --stacktrace 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^e: |FAILURE:|FAILED|AssertionFailedError|Exception:' test.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=desktop-test::${line:0:190}"
            done
            tail -n 25 test.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=tail::${line:0:190}"
            done
            exit "$rc"
          fi

  windows-package:
    name: "Windows: Portable ZIP + MSI установщик"
    needs: desktop-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: "Загрузка и проверка официального драйвера Wintun 0.14.1 (amd64)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wintunZip = "$env:TEMP\wintun-0.14.1.zip"
          $wintunDir = "$env:TEMP\wintun-extract"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $wintunZip
          $zipHash = (Get-FileHash $wintunZip -Algorithm SHA256).Hash.ToLower()
          Write-Host "wintun-0.14.1.zip SHA-256: $zipHash"
          if ($zipHash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            Write-Host "::error title=wintun::Неожиданный SHA-256 архива wintun-0.14.1.zip: $zipHash"
            exit 1
          }
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $dll = Join-Path $wintunDir "wintun\bin\amd64\wintun.dll"
          if (-not (Test-Path $dll)) {
            Write-Host "::error title=wintun::Не найден amd64/wintun.dll в архиве"
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $dll
          Write-Host "Wintun Authenticode: Status=$($sig.Status) Subject=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            Write-Host "::error title=wintun::Подпись wintun.dll невалидна: $($sig.Status)"
            exit 1
          }
          $resDir = "desktop/src/main/resources/native/win32-x86-64"
          New-Item -ItemType Directory -Force -Path $resDir | Out-Null
          Copy-Item $dll (Join-Path $resDir "wintun.dll") -Force
          Write-Host "Вшит подписанный wintun.dll → $resDir/wintun.dll"

      - name: "Сборка портативного приложения (WarpScout.exe + встроенный JRE + Wintun)"
        shell: pwsh
        run: |
          ./gradlew --no-daemon :desktop:createDistributable --stacktrace 2>&1 | Tee-Object -FilePath build-dist.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-dist.log | Select-String -Pattern 'FAILURE|Caused by|Error|Exception|FAILED|jpackage' | Select-Object -First 25 | ForEach-Object {
              Write-Host "::error title=createDistributable::$($_.Line.Substring(0, [Math]::Min(190, $_.Line.Length)))"
            }
            Get-Content build-dist.log -Tail 25 | ForEach-Object {
              if ($_.Trim().Length -gt 0) {
                Write-Host "::error title=tail::$($_.Substring(0, [Math]::Min(190, $_.Length)))"
              }
            }
            exit 1
          }

      - name: "Вшивание UAC-манифеста (requireAdministrator) в WarpScout.exe и добавление bin/wintun.dll"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = "desktop/build/compose/binaries/main/app/WarpScout"
          $exe = Join-Path $appDir "WarpScout.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error title=manifest::Не найден $exe"
            exit 1
          }
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $mt) {
            Write-Host "::error title=manifest::Не найден Windows SDK mt.exe для вшивания UAC-манифеста"
            exit 1
          }
          Write-Host "Используем mt.exe: $($mt.FullName)"
          & $mt.FullName -nologo -manifest "desktop/windows/WarpScout.manifest" -outputresource:"$exe;#1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=manifest::mt.exe завершился с кодом $LASTEXITCODE"
            exit 1
          }
          & $mt.FullName -nologo -inputresource:"$exe;#1" -out:"verify.manifest"
          $manifestText = Get-Content "verify.manifest" -Raw
          if ($manifestText -notmatch "requireAdministrator") {
            Write-Host "::error title=manifest::requireAdministrator не найден в ресурсах WarpScout.exe"
            exit 1
          }
          Write-Host "UAC-манифест requireAdministrator успешно вшит и проверен в WarpScout.exe"

          New-Item -ItemType Directory -Force -Path "$appDir/bin" | Out-Null
          Copy-Item "desktop/src/main/resources/native/win32-x86-64/wintun.dll" "$appDir/bin/wintun.dll" -Force

      - name: "Сборка MSI-установщика Windows (из патченного WarpScout.exe с UAC)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Select-String -Path "desktop/build.gradle.kts" -Pattern 'val appVersion = "([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          $appDir = (Resolve-Path "desktop/build/compose/binaries/main/app/WarpScout").Path
          $iconPath = (Resolve-Path "desktop/src/main/resources/icons/warpscout.ico").Path
          $msiDest = "out-msi"
          New-Item -ItemType Directory -Force -Path $msiDest | Out-Null

          # Добавляем WiX Toolset в PATH (jpackage использует candle.exe/light.exe).
          $wixBin = @(
            $env:WIX,
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($wixBin) {
            $env:PATH = "$wixBin;$env:PATH"
          }

          $jpackage = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          & $jpackage `
            --type msi `
            --app-image $appDir `
            --name "WarpScout" `
            --app-version $version `
            --vendor "WarpScout" `
            --description "WarpScout Desktop - Cloudflare WARP and AmneziaWG auto-tuner and tunnel" `
            --copyright "MIT License" `
            --icon $iconPath `
            --win-menu `
            --win-menu-group "WarpScout" `
            --win-shortcut `
            --win-dir-chooser `
            --win-upgrade-uuid "7a6b3e1d-8c42-4d91-9b0f-45b9b9188a3c" `
            --dest $msiDest 2>&1 | Tee-Object -FilePath build-msi.log

          if ($LASTEXITCODE -ne 0) {
            Get-Content build-msi.log -Tail 30 | ForEach-Object {
              if ($_.Trim().Length -gt 0) {
                Write-Host "::error title=jpackage-msi::$($_.Substring(0, [Math]::Min(190, $_.Length)))"
              }
            }
            exit 1
          }

      - name: "Упаковка артефактов и SHA-256"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Select-String -Path "desktop/build.gradle.kts" -Pattern 'val appVersion = "([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          Write-Host "Версия: $version"

          New-Item -ItemType Directory -Force -Path "out-win" | Out-Null

          $appDir = "desktop/build/compose/binaries/main/app/WarpScout"
          if (-not (Test-Path $appDir)) {
            throw "Не найден каталог сборки: $appDir"
          }

          $zipPath = "out-win/WarpScout-$version-windows-x64-portable.zip"
          Compress-Archive -Path "$appDir/*" -DestinationPath $zipPath -Force

          $msi = Get-ChildItem -Path "out-msi" -Filter "*.msi" | Select-Object -First 1
          if ($null -eq $msi) {
            throw "Не найден MSI-установщик в out-msi"
          }
          $msiOut = "out-win/WarpScout-$version-windows-x64.msi"
          Copy-Item $msi.FullName $msiOut -Force

          Get-ChildItem -Path "out-win" -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "out-win/SHA256SUMS.txt" -Encoding UTF8

          Get-ChildItem "out-win"
          Get-Content "out-win/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: warpscout-windows-x64
          path: out-win/*
          if-no-files-found: error

  release-windows:
    name: "Windows → GitHub Release"
    needs: windows-package
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: warpscout-windows-x64
          path: out-win

      - name: "Публикация релиза Windows"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' desktop/build.gradle.kts)
          TAG="${INPUT_TAG:-desktop-windows-preview}"
          {
            echo "WarpScout Desktop $VERSION для Windows 10/11 (x64)."
            echo
            echo "Подбирает рабочую точку Cloudflare WARP и профиль шума AmneziaWG, поднимает"
            echo "собственный системный туннель одной кнопкой (встроенное ядро :core + подписанный драйвер Wintun)"
            echo "и живёт в системном трее. Сторонние VPN-клиенты устанавливать не нужно."
            echo
            echo "**По умолчанию включён «Пресет обхода РФ»:** зарубежные сайты и сервисы идут через туннель, а российские (банки, Госуслуги, Яндекс, VK, маркетплейсы) и локальная сеть — напрямую. Переключить на «Весь трафик» можно в один клик во вкладке *Маршруты*."
            echo
            echo "| Файл | Описание |"
            echo "|---|---|"
            echo "| \`WarpScout-$VERSION-windows-x64.msi\` | **Установщик Windows** (ярлык в меню Пуск, встроенные JRE и Wintun) |"
            echo "| \`WarpScout-$VERSION-windows-x64-portable.zip\` | Портативная версия — распакуй и запусти \`WarpScout.exe\` |"
            echo
            echo "**Что нужно:** только Windows 10/11 (x64). Java, AmneziaWG и сторонние драйверы устанавливать не нужно — всё уже внутри."
          } > notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "WarpScout Desktop $VERSION (Windows)" --notes-file notes.md --prerelease
            gh release upload "$TAG" out-win/* --clobber
          else
            gh release create "$TAG" out-win/* --title "WarpScout Desktop $VERSION (Windows)" --notes-file notes.md --target "$GITHUB_SHA" --prerelease
          fi
