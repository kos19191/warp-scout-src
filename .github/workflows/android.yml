name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать оба APK в GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза (пусто → latest-preview)"
        required: false
        default: ""
      restore_releases:
        description: "Вернуть удалённые релизы из артефактов прошлых прогонов: «тег прогон полный-sha» через запятую (пусто — обычная сборка)"
        required: false
        default: ""

# Один прогон на ветку: новый пуш отменяет предыдущий, чтобы не жечь минуты.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  core:
    name: "Ядро: самопроверка + интеграция с фейковым эндпоинтом"
    # Восстановление релизов (см. job «restore») ничего не собирает — сборку пропускаем.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.restore_releases == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: "Офлайн-векторы (BLAKE2s / X25519 / ChaChaPoly / WG / rekey / шум / списки / отчёты)"
        run: |
          set -o pipefail
          ./gradlew --no-daemon :cli:selftest 2>&1 | tee /tmp/selftest.log

      - name: "Векторы фейкового эндпоинта (независимая реализация на Python)"
        run: |
          set -o pipefail
          python3 -m pip install --quiet cryptography
          python3 tools/fake_warp_endpoint.py --selftest 2>&1 | tee /tmp/fake-selftest.log

      - name: "Интеграция: наш клиент против Python-сервера"
        run: |
          set -euo pipefail
          python3 tools/fake_warp_endpoint.py --test-key --port 34575 > /tmp/fake.log 2>&1 &
          sleep 2
          ss -lun | grep 34575 || echo "порт 34575 не слушается"
          cat /tmp/fake.log
          set -o pipefail
          ./gradlew --no-daemon :cli:run --args="selftest --integration 127.0.0.1:34575" 2>&1 | tee /tmp/integration.log

      # Гейт на rekey: зелёный прогон должен означать, что проверки пересогласования РЕАЛЬНО
      # выполнялись, а не были случайно выключены или тихо пропущены. Причину падения пишем
      # аннотациями (`::error`) — они читаются через API, в отличие от blob-логов прогона.
      - name: "Гейт: rekey-проверки выполнялись"
        if: always()
        run: |
          fail=0
          err() { echo "::error title=rekey-gate::$1"; fail=1; }
          say() { echo "::notice title=rekey-gate::$1"; }

          if grep -q "✗" /tmp/selftest.log /tmp/integration.log 2>/dev/null; then
            while IFS= read -r line; do err "провал: ${line:0:180}"; done < <(grep -h "✗" /tmp/selftest.log /tmp/integration.log | head -10)
          fi

          need() {
            if grep -qF "$2" "$1"; then say "ok: $2"; else
              err "нет строки «$2» в $1"
              while IFS= read -r line; do say "контекст: ${line:0:180}"; done < <(grep -i "rekey" "$1" | tail -6)
            fi
          }
          need /tmp/selftest.log "rekey: сессия поднялась"
          need /tmp/selftest.log "rekey: сессия пересогласована сама"
          need /tmp/selftest.log "rekey: данные идут после пересогласования"
          need /tmp/selftest.log "rekey: возраст сессии обнулился"
          need /tmp/selftest.log "rekey: в тишине сессия не пересогласовывается"
          need /tmp/selftest.log "rekey: после простоя данные идут"
          need /tmp/selftest.log "сеть: handshake переживает потерю первой инициации"
          need /tmp/selftest.log "сеть: повтор ушёл раньше общего окна (быстро)"
          need /tmp/selftest.log "сеть: данные идут после потери инициации"
          need /tmp/integration.log "integration: сессия пересогласована автоматически"
          # Метка времени в инициации (TAI64N): свой сервер отвергает инициацию с меткой не новее прошлой.
          need /tmp/selftest.log "метка времени: инициации подряд (в одну миллисекунду) строго растут"
          need /tmp/selftest.log "rekey: метка времени каждой инициации новее прошлой"
          # «Подключено» = данные ходят: мягкий порог подозрения и честный разбор ответа Cloudflare.
          need /tmp/selftest.log "подозрение: 8 пакетов и 15 с без ответа — пора проверить связь"
          need /tmp/selftest.log "trace: мимо WARP так и называется"
          # Вход в Proton (1.10.44-beta5): SRP байт в байт как у Proton и подпись модуля их ключом.
          need /tmp/selftest.log "Proton: доказательство клиента M1 как у python-proton-core"
          need /tmp/selftest.log "Proton: подменённый текст модуля отвергнут"
          # Начальные экраны (1.10.44-beta6): сохраняется ровно отмеченное, снятое руками не возвращается.
          need /tmp/selftest.log "начальные экраны: сохраняются ровно отмеченные"
          need /tmp/selftest.log "начальные экраны: снятый TikTok второй выход не получает, отмеченный ChatGPT — получает"

          say "галочек в selftest: $(grep -c '✓' /tmp/selftest.log || true)"
          say "галочек в интеграции: $(grep -c '✓' /tmp/integration.log || true)"
          say "строк про rekey: $(grep -ci 'rekey' /tmp/selftest.log || true)"

          # Если прогон упал рано (не компилируется, упал плагин), в логах прогона причины не видно —
          # поэтому хвост лога тоже уходит аннотациями. Так ошибка сборки читается через API.
          if [ "$fail" != 0 ]; then
            for f in /tmp/selftest.log /tmp/integration.log /tmp/fake.log; do
              [ -f "$f" ] || { err "нет файла $f"; continue; }
              # Kotlin печатает ошибки строками «e: file:line:col ...» — их и показываем первыми.
              while IFS= read -r line; do
                [ -n "$line" ] && err "$(basename "$f") ОШИБКА: ${line:0:190}"
              done < <(grep -nE '^(e: |e:  )|^> Task .*FAILED|error:|Caused by|FAILURE:' "$f" | head -25)
              while IFS= read -r line; do
                [ -n "$line" ] && err "$(basename "$f"): ${line:0:190}"
              done < <(tail -n 12 "$f")
            done
          fi
          exit $fail

      # Отчёт самопроверки целиком: в веб-логе видно только хвост шага, а тут — все строки,
      # включая rekey-проверки, итоговый счётчик и причины падений.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-logs
          path: |
            /tmp/selftest.log
            /tmp/fake-selftest.log
            /tmp/integration.log
            /tmp/fake.log

      # Логи GitHub Actions лежат в blob-хранилище, которое из некоторых окружений не
      # открывается; поэтому при падении складываем хвосты логов в комментарий PR.
      - name: "Диагностика упавшего шага"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Диагностика: job «${{ github.job }}» упал"
            echo "Коммит: ${{ github.sha }}"
            for f in /tmp/selftest.log /tmp/fake-selftest.log /tmp/fake.log /tmp/integration.log; do
              if [ -f "$f" ]; then
                echo "### \`$f\`"
                echo '```'
                tail -120 "$f"
                echo '```'
              fi
            done
          } > /tmp/diag.md
          # Причину дублируем аннотациями: их видно через API, а blob-логи прогона — нет.
          for f in /tmp/selftest.log /tmp/fake-selftest.log /tmp/fake.log /tmp/integration.log \
                   /tmp/stubcheck.log /tmp/sdk-licenses.log /tmp/sdk-install.log /tmp/apk.log; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              echo "::error title=$(basename "$f")::${line:0:190}"
            done < <(grep -nE '^(e: |e:  )|^> Task .*FAILED|error:|Error|Traceback|Caused by|FAILURE:|Exception' "$f" | head -20)
            while IFS= read -r line; do
              echo "::error title=$(basename "$f") tail::${line:0:190}"
            done < <(tail -n 12 "$f")
          done
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/diag.md
          else
            cat /tmp/diag.md
          fi

  apk:
    name: "APK (scout + tunnel)"
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.restore_releases == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # SDK 35 на образе раннера может отсутствовать — ставим явно и принимаем лицензии.
      - name: "Android SDK 35"
        run: |
          set -x
          command -v sdkmanager || echo "sdkmanager не найден в PATH"
          sdkmanager --version || true
          yes | sdkmanager --licenses > /tmp/sdk-licenses.log 2>&1 || echo "лицензии: rc=$?"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk-install.log 2>&1 || echo "install: rc=$?"
          tail -5 /tmp/sdk-install.log
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи лежит в репозитории (app/debug.keystore) и одинаков во всех сборках.
      # Раньше его «фиксировали» кешем GitHub Actions: кеш истекает после недели простоя,
      # на следующей сборке создавался новый ключ, и обновление на телефоне переставало
      # ставиться. Теперь стабильность подписи проверяется прямо в логе сборки.
      - name: "Проверка ключа подписи"
        run: |
          set -o pipefail
          test -f app/debug.keystore || { echo "::error title=подпись::нет app/debug.keystore"; exit 1; }
          keytool -list -v -keystore app/debug.keystore -storetype PKCS12 \
            -storepass "${WARPSCOUT_STOREPASS:-warpscout}" 2>&1 | tee /tmp/keytool.log | grep -E "Alias|SHA256|Valid"

      - name: "Ресурсы и форматные строки (без SDK)"
        run: |
          set -o pipefail
          python3 tools/android_stub_check.py 2>&1 | tee /tmp/stubcheck.log

      - name: "Сборка отладочных APK"
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleScoutDebug :app:assembleTunnelDebug 2>&1 | tee /tmp/apk.log

      # Главная проверка подписи — по готовым APK, а не по файлу ключа: важно, чем подписан
      # именно тот файл, который человек скачает. Отпечаток закреплён: если он изменится,
      # обновление «поверх» перестанет ставиться («Пакет конфликтует с существующим пакетом»),
      # поэтому сборка должна падать здесь, а не на телефоне.
      - name: "Подпись готовых APK = закреплённый ключ"
        run: |-
          set -o pipefail
          PINNED="76b0e9eb5436d15108a044d8ee4b87b1ea80a5c059acdf59dd5a2dae6428dfb0"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          fail=0
          n=0
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            n=$((n + 1))
            echo "== $apk"
            out=$("$APKSIGNER" verify --print-certs "$apk" 2>&1) || { echo "$out"; echo "::error title=подпись::apksigner не смог проверить $apk"; fail=1; continue; }
            echo "$out" | grep -iE "Signer #1 certificate (DN|SHA-256 digest)" || true
            if echo "$out" | grep -qi "$PINNED"; then
              echo "ok: подпись совпадает с закреплённой"
            else
              echo "::error title=подпись::$apk подписан НЕ закреплённым ключом — обновление поверх не встанет"
              fail=1
            fi
          done < <(find app/build/outputs/apk -name '*.apk' | sort)
          [ "$n" -gt 0 ] || { echo "::error title=подпись::не нашёл ни одного APK"; fail=1; }
          exit $fail

      # С 1.10.32: «Защита приложений» Samsung (движок McAfee) назвала 1.10.31 вредоносной — из-за
      # разрешения ставить другие приложения. Проверяем итоговый манифест готовых APK (вместе с
      # библиотеками): таких разрешений там быть не должно. Полный список — в заметках сборки.
      - name: "Разрешения готовых APK: без установки приложений и без списка всех приложений"
        run: |-
          set -o pipefail
          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name aapt2 -type f | sort | tail -1)
          echo "aapt2: $AAPT2"
          FORBIDDEN="REQUEST_INSTALL_PACKAGES QUERY_ALL_PACKAGES PACKAGE_USAGE_STATS REQUEST_DELETE_PACKAGES"
          fail=0
          n=0
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            n=$((n + 1))
            perms=$("$AAPT2" dump permissions "$apk" 2>&1) || { echo "$perms"; echo "::error title=разрешения::aapt2 не прочитал $apk"; fail=1; continue; }
            echo "== $apk"
            echo "$perms"
            list=$(echo "$perms" | grep -oE "android\.permission\.[A-Z_]+" | sed 's/android.permission.//' | sort -u | tr '\n' ' ' || true)
            echo "::notice title=разрешения $(basename "$apk")::$list"
            for p in $FORBIDDEN; do
              if echo "$perms" | grep -qE "android\.permission\.$p([^A-Z_]|\$)"; then
                echo "::error title=разрешения::$(basename "$apk") просит $p — антивирусы считают это признаком вредоносного приложения"
                fail=1
              fi
            done
          done < <(find app/build/outputs/apk -name '*.apk' | sort)
          [ "$n" -gt 0 ] || { echo "::error title=разрешения::не нашёл ни одного APK"; fail=1; }
          exit $fail

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: warpscout-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Логи GitHub Actions лежат в blob-хранилище, которое из некоторых окружений не
      # открывается; поэтому при падении складываем хвосты логов в комментарий PR.
      - name: "Диагностика упавшего шага"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Диагностика: job «${{ github.job }}» упал"
            echo "Коммит: ${{ github.sha }}"
            for f in /tmp/selftest.log /tmp/fake-selftest.log /tmp/fake.log /tmp/integration.log \
                     /tmp/stubcheck.log /tmp/sdk-licenses.log /tmp/sdk-install.log /tmp/apk.log; do
              if [ -f "$f" ]; then
                echo "### \`$f\`"
                echo '```'
                tail -120 "$f"
                echo '```'
              fi
            done
          } > /tmp/diag.md
          # Причину дублируем аннотациями: их видно через API, а blob-логи прогона — нет.
          for f in /tmp/selftest.log /tmp/fake-selftest.log /tmp/fake.log /tmp/integration.log \
                   /tmp/stubcheck.log /tmp/sdk-licenses.log /tmp/sdk-install.log /tmp/apk.log; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              echo "::error title=$(basename "$f")::${line:0:190}"
            done < <(grep -nE '^(e: |e:  )|^> Task .*FAILED|error:|Error|Traceback|Caused by|FAILURE:|Exception' "$f" | head -20)
            while IFS= read -r line; do
              echo "::error title=$(basename "$f") tail::${line:0:190}"
            done < <(tail -n 12 "$f")
          done
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/diag.md
          else
            cat /tmp/diag.md
          fi

  # APK, который можно скачать одной ссылкой, а не искать в артефактах прогона.
  # Запускается только на тег v* и вручную (workflow_dispatch → publish_release=true):
  # пуш в main релиз не создаёт, чтобы не плодить «latest-preview»-черновики.
  release:
    name: "APK → GitHub Release"
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: warpscout-debug-apk
          path: apk

      - name: "Имена, версия и контрольные суммы"
        id: pack
        run: |
          set -euo pipefail
          ls -la apk
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          SCOUT=$(find apk -name '*scout*.apk' | head -1)
          TUNNEL=$(find apk -name '*tunnel*.apk' | head -1)
          [ -n "$SCOUT" ] && [ -n "$TUNNEL" ] || { echo "не нашёл один из APK"; find apk -name '*.apk'; exit 1; }
          cp "$SCOUT" "out/WarpScout-$VERSION-scout.apk"
          cp "$TUNNEL" "out/WarpScout-$VERSION-tunnel.apk"
          ( cd out && sha256sum *.apk | tee SHA256SUMS.txt )
          ls -l out

      - name: "Публикация релиза"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="latest-preview"; fi
          fi
          echo "тег: $TAG"
          # Бета (с 1.10.44-beta1): тег вида v1.10.44-beta1 — пре-релиз, «Latest» не становится. Обычная
          # версия смотрит только на releases/latest (пре-релизы туда не попадают) и бету себе не ставит;
          # «пять последних» считает только теги версий vX.Y.Z — беты их не вытесняют.
          BETA=0
          if [[ "$TAG" == *-beta* ]]; then BETA=1; fi

          # Описание релиза — только про сам релиз: что лежит в файлах, что нужно для установки и
          # обновления, что приложение делает. Без пересказа правок и истории версий: изменения живут в
          # коммитах, а страница релиза нужна человеку, который пришёл скачать APK. README — того же тега,
          # что и релиз: ветка main от релизов отстаёт.
          {
            echo "WarpScout $VERSION — Android-приложение для работы через Cloudflare WARP."
            echo
            echo "Находит в вашей сети адрес Cloudflare, который пропускает трафик, поднимает на нём туннель"
            echo "WireGuard/AmneziaWG и держит его сам: переподключается после обрыва и смены сети, меняет точку"
            echo "входа, когда прежняя перестала отвечать, и показывает, что реально открывается. Сайты, закрытые"
            echo "для российских адресов (ChatGPT, Claude, Gemini, Grok), может пускать через второй выход — ваш"
            echo "сервер WireGuard/AmneziaWG или бесплатный Proton VPN, — а TikTok пускает через второй выход целиком:"
            echo "с российского адреса он показывает только старые видео."
            echo
            echo "| Файл | Что внутри | applicationId |"
            echo "|---|---|---|"
            echo "| \`WarpScout-$VERSION-tunnel.apk\` | открывается упрощённым экраном: кнопка, связь, резервная точка | \`dev.warpscout.app.tunnel\` |"
            echo "| \`WarpScout-$VERSION-scout.apk\` | то же приложение, открывается расширенным экраном со всеми вкладками | \`dev.warpscout.app\` |"
            echo "| \`SHA256SUMS.txt\` | контрольные суммы SHA-256 обоих APK | |"
            echo
            echo "**Что нужно.** Android 8.0 и новее. При первом подключении система спросит разрешение на VPN,"
            echo "на Android 13 и новее — ещё на уведомления."
            echo
            echo "**Как поставить.** Разрешите «Установка неизвестных приложений» браузеру или файловому менеджеру"
            echo "и откройте APK."
            echo
            echo "**Как обновить.** Кнопка «Проверить обновления» в приложении скачивает новую версию в «Загрузки» —"
            echo "поставьте её нажатием на файл. Или откройте APK из этого релиза поверх установленного. Настройки,"
            echo "ключи и подобранный конфиг сохраняются."
            echo
            echo "Обе сборки можно держать на телефоне одновременно (VPN в Android при этом работает только один)."
            echo "Пока работает VPN другого приложения, подбор точки не запускается: замеры шли бы через чужой туннель."
            echo "Сборки подписаны debug-ключом: для установки из файла, не для магазина приложений."
            echo "На странице релизов хранятся пять последних версий. Более старую поверх новой Android не поставит —"
            echo "только после удаления приложения (настройки при этом сотрутся)."
            echo
            echo "Как устроено приложение, что и как часто оно запрашивает — в [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md)."
            echo "Собрано автоматически из коммита \`${GITHUB_SHA:0:7}\`, прогон: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > notes.md

          if [ "$BETA" = "1" ]; then
            {
              echo "**Бета WarpScout $VERSION — для проверки, не обычное обновление.**"
              echo
              echo "Ставится отдельным приложением **«WarpScout β»** рядом с обычным WarpScout и его не трогает:"
              echo "applicationId с «.beta» на конце (\`dev.warpscout.app.tunnel.beta\`, \`dev.warpscout.app.beta\`)."
              echo "VPN в Android работает один: перед проверкой отключите туннель в обычном приложении (и «Постоянную VPN»"
              echo "для него в настройках Android, если включена), после — наоборот. Настройки, точки, второй выход"
              echo "и списки переносятся резервной копией: в обычном приложении (1.10.43.1 и новее) «Сохранить резервную"
              echo "копию» — она ляжет в «Загрузки/WarpScout», в бете — «Восстановить из копии» → «Выбрать файл…» →"
              echo "Download/WarpScout. В копиях прежних версий только основные настройки."
              echo
              echo "Обычная версия бету себе не предлагает; бета проверяет обновления только среди бет."
              echo
              echo "| Файл | Что внутри | applicationId |"
              echo "|---|---|---|"
              echo "| \`WarpScout-$VERSION-tunnel.apk\` | бета, открывается упрощённым экраном | \`dev.warpscout.app.tunnel.beta\` |"
              echo "| \`WarpScout-$VERSION-scout.apk\` | бета, открывается расширенным экраном | \`dev.warpscout.app.beta\` |"
              echo "| \`SHA256SUMS.txt\` | контрольные суммы SHA-256 обоих APK | |"
              echo
              echo "Что в бете и как устроено — в [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md), раздел «Бета»."
              echo "Собрано автоматически из коммита \`${GITHUB_SHA:0:7}\`, прогон: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > notes.md
          fi
          TITLE="WarpScout $VERSION"
          PRE=()
          if [ "$BETA" = "1" ]; then
            TITLE="WarpScout $VERSION (бета)"
            PRE=(--prerelease --latest=false)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # Описание и заголовок тоже обновляем: иначе у перезалитого релиза остаются
            # заметки и ссылка на прогон от предыдущей сборки.
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md "${PRE[@]}"
            gh release upload "$TAG" out/*.apk out/SHA256SUMS.txt --clobber
            echo "обновил существующий релиз $TAG"
          else
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              gh release create "$TAG" out/*.apk out/SHA256SUMS.txt \
                --title "$TITLE" --notes-file notes.md --verify-tag "${PRE[@]}"
            else
              gh release create "$TAG" out/*.apk out/SHA256SUMS.txt \
                --title "WarpScout $VERSION ($TAG)" --notes-file notes.md --target "$GITHUB_SHA"
            fi
            echo "создал релиз $TAG"
          fi
          gh release view "$TAG" --json url,assets --jq '{url, assets: [.assets[].name]}'

      # Хранятся пять последних релизов версий (так решил человек 23.11.2026; с 1.10.30 до этого не
      # удалялось ничего): более старые удаляются вместе с тегами. Порядок — по номеру версии, а не по
      # дате: восстановленные из артефактов релизы созданы позже более новых версий. Только что
      # опубликованный тег не трогаем, даже если он старый. Удаляет GITHUB_TOKEN — новых прогонов это не
      # запускает. Удалённую версию можно вернуть, пока живы артефакты её прогона (см. restore ниже).
      - name: "Оставить пять последних релизов"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "5"
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name' > /tmp/release_tags_all.txt
          { grep -E '^v[0-9]+(\.[0-9]+)*$' /tmp/release_tags_all.txt || true; } | sort -V -r > /tmp/release_tags.txt
          echo "релизов версий: $(wc -l < /tmp/release_tags.txt), оставляю $KEEP"
          head -n "$KEEP" /tmp/release_tags.txt | sed 's/^/оставляю: /'
          tail -n +"$((KEEP + 1))" /tmp/release_tags.txt | while read -r tag; do
            if [ "$tag" = "${GITHUB_REF_NAME}" ]; then
              echo "только что опубликован — не трогаю: $tag"
              continue
            fi
            if gh release delete "$tag" --yes --cleanup-tag; then
              echo "удалил: $tag"
            else
              echo "::warning title=релизы::не удалось удалить $tag"
            fi
          done

  # Восстановление удалённых релизов (с 1.10.30): исходные APK берутся из артефактов тех прогонов,
  # которые их собирали (артефакты живут 90 дней), без пересборки — это ровно те файлы, что были
  # опубликованы. Тег ставится через API на исходный коммит. Теги, созданные GITHUB_TOKEN, сборку
  # не запускают — поэтому workflow старого коммита со своим шагом удаления «лишних» релизов не
  # сработает и новые релизы не тронет. «Latest» остаётся за самой новой версией (--latest=false).
  restore:
    name: "Восстановление релизов из артефактов"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.restore_releases != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LIST: ${{ github.event.inputs.restore_releases }}
    steps:
      - name: "Скачать исходные APK и опубликовать"
        run: |
          # Раннер запускает шаг через «bash -e»: первая же ненулевая команда (а 404 на «есть ли
          # такой тег» — ожидаемый ответ) молча обрывала шаг без единой аннотации. Ошибки здесь
          # разбираются по каждому релизу отдельно, поэтому -e выключаем явно.
          set +e
          set -uo pipefail
          PINNED="76b0e9eb5436d15108a044d8ee4b87b1ea80a5c059acdf59dd5a2dae6428dfb0"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          fail=0
          err() { echo "::error title=восстановление::$1"; fail=1; }

          # Одна строка — один релиз: «тег прогон полный-sha». Разделитель — запятая или новая строка.
          while read -r TAG RUN SHA REST; do
            [ -n "${TAG:-}" ] || continue
            echo "::group::$TAG"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "${RUN:-}" =~ ^[0-9]+$ && "${SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              err "непонятная строка «$TAG ${RUN:-} ${SHA:-}»: нужно «тег прогон полный-sha»"; echo "::endgroup::"; continue
            fi
            VERSION="${TAG#v}"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::notice title=восстановление::$TAG уже есть — не трогаю"; echo "::endgroup::"; continue
            fi
            # Тег уже есть — релиз публикуется на нём (--verify-tag). Годится тот же коммит или
            # служебный коммит прямо поверх него. Служебный нужен, когда workflow исходного коммита
            # отличается от main: тогда GITHUB_TOKEN ставить тег не вправе (403), тег ставится
            # вручную на коммит с тем же кодом, у которого из старого workflow убран запуск по тегу.
            target=(--target "$SHA")
            have=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)
            if [[ "$have" =~ ^[0-9a-f]{40}$ ]]; then
              if [ "$have" != "$SHA" ]; then
                parent=$(gh api "repos/$GH_REPO/git/commits/$have" --jq '.parents[0].sha' 2>/dev/null)
                if [ "$parent" != "$SHA" ]; then
                  err "тег $TAG стоит на ${have:0:7}: это не ${SHA:0:7} и не коммит поверх него"; echo "::endgroup::"; continue
                fi
                echo "тег $TAG стоит на служебном коммите ${have:0:7} поверх ${SHA:0:7}"
              fi
              target=(--verify-tag)
            fi
            # Прогон собран именно из этого коммита, и в коммите именно эта версия.
            head=$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.head_sha' 2>/dev/null)
            if [ "$head" != "$SHA" ]; then
              err "прогон $RUN собран из «${head:0:7}», а не из ${SHA:0:7}"; echo "::endgroup::"; continue
            fi
            built=$(gh api "repos/$GH_REPO/contents/app/build.gradle.kts?ref=$SHA" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null | grep -oP 'versionName\s*=\s*"\K[^"]+' | head -1)
            if [ "$built" != "$VERSION" ]; then
              err "в коммите ${SHA:0:7} версия «$built», а тег $TAG"; echo "::endgroup::"; continue
            fi

            work="work/$TAG"
            rm -rf "$work"; mkdir -p "$work/apk" "$work/out"
            if ! out=$(gh run download "$RUN" -n warpscout-debug-apk -D "$work/apk" 2>&1); then
              err "$TAG: не скачался артефакт прогона $RUN: ${out:0:150}"; echo "::endgroup::"; continue
            fi
            SCOUT=$(find "$work/apk" -name '*scout*.apk' | head -1)
            TUNNEL=$(find "$work/apk" -name '*tunnel*.apk' | head -1)
            if [ -z "$SCOUT" ] || [ -z "$TUNNEL" ]; then
              find "$work/apk" -type f
              err "$TAG: в артефакте прогона $RUN нет одного из APK"; echo "::endgroup::"; continue
            fi
            cp "$SCOUT" "$work/out/WarpScout-$VERSION-scout.apk"
            cp "$TUNNEL" "$work/out/WarpScout-$VERSION-tunnel.apk"
            ( cd "$work/out" && sha256sum *.apk | tee SHA256SUMS.txt )

            # Подпись проверял исходный прогон; здесь — ещё раз, если на раннере есть apksigner.
            bad=0
            if [ -n "$APKSIGNER" ]; then
              for apk in "$work"/out/*.apk; do
                if "$APKSIGNER" verify --print-certs "$apk" 2>&1 | grep -qi "$PINNED"; then
                  echo "подпись совпадает с закреплённой: $(basename "$apk")"
                else
                  bad=1; err "$TAG: $(basename "$apk") подписан не закреплённым ключом"
                fi
              done
            else
              echo "::warning title=восстановление::apksigner не найден — подпись проверена только исходным прогоном"
            fi
            [ "$bad" = 0 ] || { echo "::endgroup::"; continue; }

            # Описание — тот же шаблон, что у выпусков 1.10.25–1.10.26 (таблица — про тогдашние
            # сборки), ссылка — на прогон, который собрал эти файлы.
            {
              echo "WarpScout $VERSION — Android-приложение для работы через Cloudflare WARP."
              echo
              echo "Находит в вашей сети адрес Cloudflare, который пропускает трафик, поднимает на нём"
              echo "туннель WireGuard/AmneziaWG и держит его сам: переподключается после смены сети,"
              echo "меняет точку входа, когда прежняя перестала отвечать, показывает, что реально"
              echo "открывается, и умеет отправить часть сайтов в свою страну через второй туннель."
              echo "Своих серверов и посредников нет: только адреса Cloudflare и телефон."
              echo
              echo "| Файл | Что внутри | applicationId |"
              echo "|---|---|---|"
              echo "| \`WarpScout-$VERSION-tunnel.apk\` | полная сборка: подбор, собственный туннель, проверки из-под него | \`dev.warpscout.app.tunnel\` |"
              echo "| \`WarpScout-$VERSION-scout.apk\` | только подбор и экспорт конфигов для AmneziaVPN | \`dev.warpscout.app\` |"
              echo
              echo "**Что нужно:** Android 8.0 и новее; при первом подключении система спросит разрешение"
              echo "на VPN. Для разделения по приложениям — доступ к списку приложений."
              echo
              echo "**Как поставить:** разрешить установку из неизвестных источников → открыть APK."
              echo "Обновление ставится поверх предыдущей версии: настройки, ключи и подобранный конфиг"
              echo "сохраняются. Обе сборки можно держать на телефоне одновременно — идентификаторы разные."
              echo "Сборки подписаны debug-ключом: для сайдлоада и тестов, не для магазина."
              echo
              echo "Контрольные суммы SHA-256 — \`SHA256SUMS.txt\` в этом же релизе."
              echo "Как устроено приложение, что и как часто оно запрашивает — в [README](https://github.com/${GH_REPO}/blob/main/README.md)."
              echo "Собрано автоматически из коммита \`${SHA:0:7}\`, прогон: https://github.com/${GH_REPO}/actions/runs/${RUN}"
              echo
              echo "—"
              echo "Предыдущие версии остаются на странице релизов. Вернуться на более старую можно, только"
              echo "удалив текущую: поверх новой версии Android старую не ставит (настройки при этом сотрутся)."
            } > "$work/notes.md"

            if ! out=$(gh release create "$TAG" "$work"/out/*.apk "$work/out/SHA256SUMS.txt" \
                "${target[@]}" --title "WarpScout $VERSION" --notes-file "$work/notes.md" --latest=false 2>&1); then
              err "$TAG: релиз не создан: ${out:0:170}"; echo "::endgroup::"; continue
            fi
            echo "$out"
            assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(", ")' 2>/dev/null)
            echo "::notice title=восстановление::$TAG восстановлен из прогона $RUN: $assets"
            echo "::endgroup::"
          done < <(printf '%s\n' "$LIST" | tr ',;' '\n\n')

          echo "релизы сейчас:"
          gh api "repos/$GH_REPO/releases?per_page=20" --jq '.[] | "\(.tag_name)\t\(.created_at)"' || true
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null)
          echo "::notice title=восстановление::Latest = $latest"
          exit $fail
