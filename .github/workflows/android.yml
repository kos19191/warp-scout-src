name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Один прогон на ветку: новый пуш отменяет предыдущий, чтобы не жечь минуты.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: "Ядро: самопроверка + интеграция с фейковым эндпоинтом"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: "Офлайн-векторы (BLAKE2s / X25519 / ChaChaPoly / WG / шум / отчёты)"
        run: ./gradlew --no-daemon :cli:selftest
      - name: "Интеграция: независимый WireGuard-сервер на Python"
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/fake_warp_endpoint.py --selftest
          python3 tools/fake_warp_endpoint.py --test-key --port 34575 &
          sleep 2
          ./gradlew --no-daemon :cli:run --args="selftest --integration 127.0.0.1:34575"

  apk:
    name: "APK (scout + tunnel)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # SDK 35 на образе раннера может отсутствовать — ставим явно и принимаем лицензии.
      - uses: android-actions/setup-android@v3
      - name: "Android SDK 35"
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: "Ресурсы и форматные строки (без SDK)"
        run: python3 tools/android_stub_check.py
      - name: "Сборка отладочных APK"
        run: ./gradlew --no-daemon :app:assembleScoutDebug :app:assembleTunnelDebug
      - uses: actions/upload-artifact@v4
        with:
          name: warpscout-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
